<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="U and I Studio">
  <rect width="1600" height="900" fill="#ffffff"/>
  <!-- 공통 중심(800,450). STUDIO letter-spacing 끝 여백 보정: x = spacing/2 -->
  <g transform="translate(800, 450)" fill="#111111" font-family="Georgia, 'Times New Roman', 'Noto Serif KR', serif">
    <text
      x="0"
      y="-58"
      text-anchor="middle"
      dominant-baseline="middle"
      font-size="132"
      font-weight="400"
    >U&amp;I</text>
    <text
      x="12"
      y="62"
      text-anchor="middle"
      dominant-baseline="middle"
      font-size="52"
      font-weight="400"
      letter-spacing="24"
    >STUDIO</text>
  </g>
</svg>
